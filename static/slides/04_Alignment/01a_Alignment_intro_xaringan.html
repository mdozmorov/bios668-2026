## Protein sequencing

.pull-left[

* Fred Sanger and colleagues sequenced insulin, the first complete protein sequence (1945–1955).
* Established that every protein has a characteristic primary structure.
* Protein sequencing established the concept of a biological sequence as an analyzable object.
* This directly motivated early computational approaches to sequence comparison.

&lt;!-- * Moore and Stein developed semi-automated sequencing techniques that enabled scale. --&gt;
  ]

## Alignment — definition and goals

**Alignment** is the process of determining how or where a read sequence matches a reference sequence.

* Human genome: ~3.2 billion bases

* Modern sequencers: hundreds of millions to billions of short reads

* Goal: assign each read to its most likely genomic origin

* Read alignment is different from classical global/local sequence alignment.

## Sequencing coverage

* Coverage = average number of reads covering each genomic base

* Coverage = (reads × read length) / genome size.

Example:
If the genome is 100 Mbp, sequencing 1M × 100 bp reads gives ~1× coverage.

* Coverage is an expectation; local coverage varies substantially.

## Library complexity

* Library complexity `\(C\)` = number of unique molecules present in the sequencing library
* Low complexity → many duplicates, limited new information

&lt;img src="img/library_complexity.png" alt="" width="800px" style="display: block; margin: auto;" /&gt;
???

* PCR duplication reduces effective sequencing depth.
* Motivates duplicate marking and complexity estimation.

## Modeling approach

- Assume we have `\(C\)` unique molecules in the library and we obtain `\(N\)` sequencing reads

- The probability distribution of the number of times we sequence a particular molecule is binomial (individual success probability `\(p=1/C\)`, `\(N\)` trials in total)

- Assume Poisson sampling as a tractable approximation (rate `\(\lambda = N/C\)`)

- Finally, truncate the Poisson process: we only see events that happened between `\(L\)` (the minimum number of times a molecule must be observed to appear in the data) and `\(R\)` (the maximum number of times a molecule is allowed or observed) times. We don’t know how many molecules were observed `\(0\)` times.

---
## Poisson distribution — refresher

- The probability of a given number of events occurring in a fixed interval of time and/or space if these events occur with a known average rate and independently of the time since the last event.
&lt;!--- Formulation comes from the limit of the binomial equation--&gt;
- Resembles a normal distribution, but over the positive values, and with only a single parameter.

Key properties

- The standard deviation is the square root of the mean.
- For mean &gt; 5, well approximated by a normal distribution

`$$P(k)=\frac{\lambda^k}{k!}e^{-\lambda}$$`

## Estimating library complexity with a Poisson model

- For Poisson sampling, we can write the (truncated) distribution over `\(x_i\)` the times we sequence the `\(i^{th}\)` molecule as:
`$$Pr(x_i|\lambda)=\frac{1}{K_{L,R}(\lambda)}*\frac{\lambda^{x_i}}{x_i!}e^{-\lambda}$$`
`$$K_{L,R}(\lambda)=\sum_{x=L}^RPr(x_i|\lambda)$$`
`\(K_{L,R}(\lambda)\)` - Normalization constant, accounts for the fact that we can only observe molecules sequenced between `\(L\)` and `\(R\)` times. It's the sum of probabilities for all observable outcomes, ensuring the truncated distribution sums to 1. The probability is `\(0\)` if `\(x_i\)` is less than `\(L\)` or greater than `\(R\)`.

- We can estimate the maximum likelihood rate parameter `\(\lambda\)` from a vector of observations `\(x\)`

---
## Maximum likelihood library size

- `\(K_{L,R}(\lambda)\)` represents the *fraction* of molecules we expect to observe (those with counts in `\([L,R]\)`). 
&lt;!-- `$$K_{L,R}(\lambda)=\sum_{x=L}^RPr(x_i|\lambda)$$` --&gt;
- `\(M\)` unique sequences observed.
- Dividing our observed count `\(M\)` by this fraction gives us the total maximum likelihood library size `\(\hat{C}\)`:

`$$\hat{C}=\frac{M}{K_{L,R}(\lambda)}$$`

- Approximate solution when `\(L=1\)` and `\(R=\infty\)`

`$$\hat{C}=\frac{M}{1-Poisson(0,\lambda)}$$`

---
## Limitations of Poisson model

* Real data: variance &gt; mean (overdispersion)
* Poisson underestimates complexity from subsampled data
* Empirical evidence against pure Poisson sampling.
* Motivates Gamma–Poisson (NB) model.

&lt;img src="img/library_complexity1.png" alt="" width="900px" style="display: block; margin: auto;" /&gt;

---
## Gamma–Poisson intuition

.pull-left[

- Gamma distributed sampling rates describe the entire population (library preparation)

- Poisson sampling to form a smaller sample (sequencing)

- Negative binomial distribution characterizes the resulting occurrence histogram
  ]

.pull-right[

&lt;img src="img/gamma_poisson_negative_binomial.png" alt="" width="300px" style="display: block; margin: auto;" /&gt;
]

???

* Gamma captures library preparation variability.
* NB naturally models overdispersion.

---
## The Biological Intuition

Think of the NB model as arising from biological heterogeneity:

- Different molecules have different "capture efficiencies" - some are easier to sequence than others due to GC content, secondary structure, PCR bias, etc.

- The heterogeneity creates overdispersion: Instead of all molecules having the same rate `\(\lambda\)` (Poisson), each molecule `\(i\)` has its own rate `\(\lambda_i\)` drawn from a Gamma distribution

- `\(k\)` controls this heterogeneity:
  - Small k → huge variation in capture efficiencies (some molecules sequenced 100x, others never)
  - Large k → all molecules roughly equally likely to be sequenced (approaches Poisson)

---
## The gamma distribution is a "conjugate prior" for the Poission distribution

.pull-left[
`$$Poisson(x;\lambda)=\frac{\lambda^x e^{-\lambda}}{x!}$$`

`$$Gamma(x,\alpha,\beta)=\frac{\beta^\alpha x^{\alpha-1} e^{-\beta x}}{\Gamma(\alpha)}$$`
]
.pull-right[
`\(Poisson(x; \lambda)\)` - Individual molecule's sequencing counts
&lt;!-- - x = number of times a specific molecule is sequenced --&gt;
&lt;!-- - λ = the sequencing rate for that molecule --&gt;
&lt;!-- - In a simple world, all molecules have the same λ --&gt;

`\(Gamma(x; \alpha, \beta)\)` - Distribution of sequencing rates across molecules
&lt;!-- - Models the **heterogeneity** in how easy different molecules are to sequence --&gt;
&lt;!-- - x here represents λ (the rate parameter itself) --&gt;
&lt;!-- - α = shape parameter (related to 1/k in your NB parameterization) --&gt;
&lt;!-- - β = rate parameter (controls the mean) --&gt;
&lt;!-- - Captures biological variation: GC content, secondary structure, PCR bias, etc. --&gt;

`\(NB(y; \alpha, \beta)\)` - The resulting distribution of observed counts
&lt;!-- - y = observed sequencing count for a molecule --&gt;
&lt;!-- - This is what we actually see in the data --&gt;
]

`$$NB(y;\alpha,\beta)=\int_0^\infty Poisson(y;x) \, Gamma(x;\alpha,\beta) \, dx$$`
???

* Integration yields NB closed form.
* Hierarchical interpretation is key.

---
## Negative Binomial model for sequence occurrences

- `\(C\)` - library complexity (latent, fit to observed data)
- `\(N\)` - number of reads
- `\(M\)` - total number of unique sequences
- `\(\lambda=N/C\)`
- `\(k\)` - dispersion (latent, fit to observed data)

`$$Pr(x_i,\lambda,k)=NB(x_i|\lambda,k)=NB(x_i|n,p)$$`
Reparameterize for classical NB interpretation  
- `\(p=\lambda/(\lambda + 1/k)\)` - "success probability" of each trial, rescales `\(\lambda\)` into a probability
- `\(n=1/k\)` - number of "successes", inversely related to dispersion

???

* NB generalizes Poisson.
* Widely used in RNA-seq and genomics.

---
## Simulation results show that the Gamma Poisson works well for non-uniform libraries

- True library complexity `\(C\)`: 1M unique molecules

- Vary `\(k\)` (controls sampling rate variance)

- Given 100K reads (`\(\lambda=0.1\)`), assess estimates from both models

| k    | `\(\hat{C}\)` using Poisson | `\(\hat{C}\)` using Gamma-Poisson |
|------|:-------:|:-------------:|
| 0.1  | 0.93M   | 0.96M         |
| 1    | 0.52M   | 1.01M         |
| 10   | 0.12M   | 1.10M         |
| 20   | 0.07M   | 0.68M         |

* Poisson collapses under heterogeneity. GP/NB remains stable.

---
## Negative Binomial Library Complexity better model 150 '1000 Genome' Datasets

&lt;img src="img/library_complexity2.png" alt="" width="800px" style="display: block; margin: auto;" /&gt;
- Data are "overdispersed" (variance greater than mean)

* Overdispersion is the rule, not the exception.

---
## Marginal value of additional sequencing

- `\(C\)` – library complexity (latent – estimated) 
- `\(N\)` – number of reads
- `\(M\)` – number of unique sequences

`\(M\)` can be estimated by `\((1 - NegativeBinomial(0 | \lambda, k)) * C\)`

- Assume we have `\(r\)` more reads `\(s = (N + r) / N\)`

- Replace `\(\lambda\)` by `\(s * \lambda\)` to estimate `\(M'\)` achieved with `\(r\)` more reads

---
## Marginal value of additional sequencing

.pull-left[
- Setup: Library with `\(C = 10^6\)` (1 million) unique molecules (dashed line)
- X-axis: Sequencing reads (total number `\(N\)`)
- Y-axis: Observed molecules (`\(M\)`, the number of unique sequences)
- Blue (k=0.005) &amp; Green (k=0.050) - Very low `\(k\)` = HIGH heterogeneity, helps observing unique molecules
- Red (k=0.500) &amp; Cyan (k=1.000) - Moderate/low heterogeneity
]
.pull-right[
&lt;img src="img/marginal_sequencing_value.png" alt="" width="500px" style="display: block; margin: auto;" /&gt;
- Diminishing returns guide experimental design
]
